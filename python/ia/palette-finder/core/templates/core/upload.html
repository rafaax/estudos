<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Upload de Imagem | Paleta de Cores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .card {
            margin-top: 40px;
            box-shadow: 0 2px 20px 0 #adb5bd44;
            border: none;
        }
        .paleta {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        .cor-paleta {
            width: 36px;
            height: 36px;
            border-radius: 5px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 1px 5px #0001;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-4">
                <h2 class="text-center mb-4 text-primary">Paleta de Cores Predominantes</h2>
                <form method="post" enctype="multipart/form-data" class="mb-3">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Enviar Imagem</button>
                </form>

                {% if uploaded %}
                    <div class="alert alert-success text-center">
                        <strong>Upload realizado com sucesso!</strong>
                    </div>
                    <div class="text-center my-4">
                        <img src="{{ imagem_url }}" class="img-fluid rounded shadow-sm" style="max-width: 320px;">
                    </div>
                    {% if cores %}
                        <h5 class="text-center mt-4 mb-2 text-secondary">Cores Predominantes:</h5>
                        <div class="paleta justify-content-center">
                            {% for cor in cores %}
                                <div class="cor-paleta" style="background: rgb{{ cor }};" title="rgb{{ cor }}"></div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endif %}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
