<html>
<head>
<title>CADASTRAMENTO</title>
<meta charset="utf-8">
</head>
<body>
    <body bgcolor="black">
    <center>
    <h1><font color="#00FF00">Cadastre-se</font></h1>
    </center><p>
    <form>
    <fieldset>
    <legend><font color="#00FF00">Cadastre-se</font></legend>
    <label for="nome"><font color="#00FF00">Seu nome:</font></label><br>
	<input type= "text" size="50" id="nome" modelo="nome"><p>
    <label for="dia"><font color="#00FF00">Sua idade:</font></label> <p>
    <input type="date" id="dia" name="dia" min="2000-01-01"><p>
        <label for="marcas"><font color="#00FF00">Você conhecia alguma das três marcas da página principal?</font></label><p>
        <label for="todas"><font color="#00FF00">Todas</font></label>
        <input type="radio" id="todas" name="marcas" value="todas">
        <label for="uma"><font color="#00FF00">Uma ou mais</font></label>
        <input type="radio" id="uma" name="marcas" value="uma">
        <label for="nenhuma"><font color="#00FF00">Nenhuma</font></label>
        <input type="radio" id="nenhuma" name="marcas" value="nenhuma"><p>
    </fieldset>
    </form>
</body>
</html>
